name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:run

      - name: Audit dependencies
        run: npm audit --audit-level=high

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gitgarden-server/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('gitgarden-server/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        working-directory: gitgarden-server
        run: cargo fmt --check

      - name: Clippy
        working-directory: gitgarden-server
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: gitgarden-server
        run: cargo test

      - name: Audit dependencies
        working-directory: gitgarden-server
        run: |
          cargo install cargo-audit --quiet
          cargo audit
